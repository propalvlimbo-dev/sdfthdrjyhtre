# =============================================================
# ElytrixBattlePass — shop.yml
# Магазин боевого пропуска. Валюта — ПОИНТЫ БП (не коины!).
# Стиль Elytrix: &#F8BEFB, «...», строки ┃, панели purple/black.
# =============================================================
#
# Внутренняя область меню НЕ заливается стёклами.
# Рамка (занята плагином):  0-10, 16, 17, 18, 26, 27, 35, 36, 37,
#                           43, 44, 46, 47, 48, 50, 51, 52, 53
# Слот 45 — «Назад», слот 49 — «Ваш баланс».
# Свободные слоты под товары: 11-15, 19-25, 28-34, 38-42
#
# Плейсхолдеры в name/lore:
#   %cost%        — цена товара в поинтах
#   %points%      — баланс игрока
#   %player_name% — ник игрока
#   %status%      — авто-строка состояния (хватает поинтов / нужна подписка
#                   / не хватает N поинтов). Если её не указать — плагин
#                   допишет строку состояния в конец лора сам.
#
# Ключи товара:
#   enabled              — включён ли товар
#   slot                 — слот в меню
#   cost                 — цена в поинтах БП
#   icon.type            — материал или PLAYER_HEAD
#   icon.texture         — base64 текстура (только для PLAYER_HEAD)
#   icon.enchanted       — эффект зачарования
#   premium_only         — только для игроков с подпиской ElytriX
#   random_command       — выдаётся ОДНА случайная награда из rewards
#   confirm_purchase     — покупка в два клика
#   close_after_purchase — закрыть меню после покупки
#   required_permission  — доп. право на покупку
#   broadcast            — сообщение в чат всему серверу
#   sound                — звук покупки
#   commands             — команды консоли (обычная покупка)
#   rewards              — список наград (command/commands, display, weight)
# =============================================================

