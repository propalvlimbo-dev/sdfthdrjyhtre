# =============================================================
# quests.yml — уровни, задания и награды ElytrixQuests
#
# Команды наград выполняются из консоли. Доступны %player%, %uuid% и,
# если установлен PlaceholderAPI, его плейсхолдеры.
# Для ванильных предметов используй minecraft:give. p give начисляет коины,
# eco give выдаёт монеты; case, kit, shadowci и elytrixitem — серверные награды.
#
# За полное прохождение уровня отдельная мега-награда не выдаётся.
#
# После выполнения задания его награда засчитывается автоматически.
# Следующее задание открывается сразу, без повторного клика по прошлому.
# =============================================================

