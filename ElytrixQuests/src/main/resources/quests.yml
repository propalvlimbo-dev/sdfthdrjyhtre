# =============================================================
# quests.yml — уровни и задания ElytrixQuests
#
# Структура:
#   levels:
#     <номер уровня>:
#       name: "Название уровня"          — титул в меню
#       mega-reward:                     — награда за ПРОХОЖДЕНИЕ уровня
#         commands:                      —   (выдаётся после забора награды
#           - "консольная команда"       --    последнего задания уровня)
#         message: "..."                 —   резерв (в код не выводится)
#       quests:
#         <номер задания>:
#           name: "Название"
#           lore:                        — строки описания в меню
#             - "&#F8BEFB&l┃ &f..."
#           icon: PAPER                  — материал иконки в меню
#           type: COMMAND_TRIGGER        — тип выполнения (см. ниже)
#           amount: 1                    — сколько раз нужно выполнить
#           trigger/region/kit/...       — параметр типа (см. ниже)
#           rewards:                     — команды КОНСОЛИ за награду
#             - "p give %player% 50"
#
# В командах наград доступны: %player% (ник) и %uuid% (UUID игрока);
# если стоит PlaceholderAPI — работают и его плейсхолдеры.
#
# Команды наград (как в ElytrixFree /free):
#   p give <ник> <кол-во>             — коины (прямая выдача)
#   case give <ник> donfree <N>       — N шт. «Бесплатный Кейс»
#   case give <ник> coins <N>         — N шт. «Коин Кейс»
#   shadowci give <ник> shar2         — «Шар Змеи»
#   shadowci give <ник> shar3         — «Шар Солнца»
#   elytrixitem:ei give <ник> <id> <кол-во> — кастомный предмет Elytrix
#                       (enchant_sun_shackles — книга «Солнечные оковы»)
#   kit give <имя> <ник>              — кит (immortal / dragon / elder)
#   give <ник> <предмет> <кол-во>     — ванильный предмет
#
# Типы заданий (type):
#   MANUAL_CLICK         — засчитывается сразу по клику в меню
#   COMMAND_TRIGGER      — ввод команды; trigger: "метка" (через запятую
#                          несколько). Метка = первое слово команды без «/»
#                          и без префикса плагина (:). Пример: trigger: "help"
#                          ловит и /help, и /server:help
#   WARP_TELEPORT        — /warp или /warps открывает окно на 2 минуты;
#                          засчитывается при следующей телепортации
#   REGION_CLAIM         — создание привата (/rg claim или /region create);
#                          засчитывается, если регион реально появился
#   KILL_PLAYER_UNIQUE   — убийства РАЗНЫХ игроков; region: "pvp" — считать
#                          только убийства, где убийца ИЛИ жертва в регионе
#   USE_TOTEM            — срабатывание тотема
#   DONATE_RECEIVE       — выдача доната игроку (команда lp user X parent
#                          add/set ... из консоли; ловится по паттерну)
#   KIT_CLAIM            — получение донат-кита; kit: "имя_кита" (опционально;
#                          без kit — любой кит игрока)
#   ACCOUNT_LINK         — «Привязка аккаунта»: привязка к Telegram.
#                          Проверка — auth.http в config.yml (HTTP API
#                          ElytrixAuth). Засчитывается автоматически после
#                          /addtg, либо сразу по клику, если уже привязан;
#                          при auth.http.enabled: false — сразу (без ElytrixAuth)
#
# Дополнительно есть типы: BREAK_BLOCK / PLACE_BLOCK (material: STONE),
#   CRAFT_ITEM / SMELT_ITEM / CONSUME_ITEM / ITEM_PICKUP (material — опционально),
#   KILL_MOB / TAME_ANIMAL (entity: ZOMBIE), KILL_PLAYER, BREED_ANIMAL,
#   SHEAR_SHEEP, FISH_ITEM, ENCHANT_ITEM, CHAT_MESSAGE, DEATH,
#   LEVEL_UP (текущий уровень), TRAVEL_DISTANCE (метров), PLAYTIME, JOIN_SERVER,
#   ADVANCEMENT (advancement: "minecraft:story/mine_stone"),
#   POTION_EFFECT (potion: "SPEED"), MONEY_BALANCE (баланс Vault).
#
# Параметр квеста читается из ПЕРВОГО найденного ключа:
#   trigger | region | value | advancement | message | potion | kit
# =============================================================

